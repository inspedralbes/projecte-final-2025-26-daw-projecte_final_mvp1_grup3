server {
    listen 80;
    server_name looppy.cat www.looppy.cat;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name looppy.cat www.looppy.cat;
    resolver 127.0.0.11 valid=30s;

    ssl_certificate /etc/letsencrypt/live/looppy.cat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/looppy.cat/privkey.pem;

    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    # API Laravel
    location ^~ /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Endpoint habitual de Laravel/Sanctum
    location ^~ /sanctum {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Socket.IO cap al backend node
    location /socket.io/ {
        proxy_pass http://backend-node:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Frontend Nuxt
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        set $upstream backend-laravel;
        fastcgi_pass $upstream:9000;

        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }
}
