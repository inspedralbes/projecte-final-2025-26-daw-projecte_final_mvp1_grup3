# =====================================================================
# Loopy - Nginx (reverse proxy)
# Dominio: looppy.cat (+ www.looppy.cat)
# Frontend Nuxt -> frontend:3000
# WebSockets   -> backend-node:3001
# Backend API  -> backend-laravel:9000 (PHP-FPM, public/index.php)
# Certificados: /etc/letsencrypt (montado desde host)
# =====================================================================

# ---------- HTTP: redirige todo a HTTPS y permite Certbot ----------
server {
    listen 80;
    listen [::]:80;
    server_name looppy.cat www.looppy.cat;

    # Necesario para validación inicial / renovación de Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name looppy.cat www.looppy.cat;

    # Certificados Let's Encrypt (montados desde el host)
    ssl_certificate     /etc/letsencrypt/live/looppy.cat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/looppy.cat/privkey.pem;

    # Seguridad SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Cabeceras de seguridad
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff"    always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;
    client_max_body_size 25M;

    # Logs
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Raíz para Laravel (public/) — necesaria para que /api -> index.php funcione
    root /var/www/public;
    index index.php index.html;

    # ---------- Backend API (Laravel) ----------
    # /api/... lo resuelve Laravel a través de public/index.php
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM (Laravel)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass backend-laravel:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_read_timeout 120s;
    }

    # ---------- WebSockets (Node.js) ----------
    location /socket.io/ {
        proxy_pass http://backend-node:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "Upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- Frontend (Nuxt) ----------
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         'upgrade';
        proxy_set_header Host               $host;
        proxy_cache_bypass                  $http_upgrade;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout 60s;
    }
}
